[package]
name = "rex-serve-demo"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "rex"
path = "api/rex.rs"

[dependencies]
rex-serve = { path = "rex/crates/rex-serve", package = "rex-serve" }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower = "0.5"
# vercel_runtime with WebSocket upgrade support, from the upstream PR
# (vercel/vercel#16708). Switch to the published `version = "2.3"` once it
# lands on crates.io.
vercel_runtime = { git = "https://github.com/vercel/vercel", branch = "rust-websocket-upgrades", features = ["axum"] }
tracing = "0.1"
tracing-subscriber = "0.3"
include_dir = "0.7"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
